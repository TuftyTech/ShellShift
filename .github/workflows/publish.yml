name: publish

on:
  schedule:
    # Every two hours, offset off the hour: every project that asks for a round interval lands
    # on :00, and the runner queue is the shared resource. A measured run takes three to six
    # minutes and the scheduler has started one half an hour late, so the slots never overlap.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # A run in flight is allowed to finish. Cancelling mid-verification wastes the expensive part
  # and publishes nothing; queueing costs only time.
  group: publish
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly
  # INV-49: without this tag every Reality node fails to construct and is silently dropped —
  # 62% of the real catalogue, looking like the feeds degraded.
  BUILD_TAGS: with_utls
  SITE_ORIGIN: https://tuftytech.github.io/ShellShift

jobs:
  collect:
    name: collect and publish
    runs-on: ubuntu-latest
    # The verification phase is bounded by the run budget in the configuration; this is the
    # backstop. The predecessor had no timeout on any job, so a hung shard could burn six hours.
    timeout-minutes: 25
    # deploy-pages refuses a job without an environment ("Missing environment"). github-pages is
    # created by the repository when Pages is set to GitHub Actions, and by default admits only main.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: build
        run: go build -tags "$BUILD_TAGS" -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o shellshift ./cmd/shellshift

      # State persistence without a write permission and without a cache.
      #
      # The ledger holds only identity hashes and statistics — no credentials, by design — so the
      # previous run can publish it and this one can fetch it back from the live site. That keeps
      # the source history free of generated state, needs no extra branch, and cannot silently
      # expire the way a cache can. Losing it degrades gracefully: every node becomes due again.
      - name: recover the previous ledger
        run: |
          mkdir -p .state
          # --compressed: Pages serves the 17 MB ledger as 3.8 MB of gzip, but only to a client
          # that asks. At twelve runs a day the difference is most of the site's own bandwidth.
          if curl -fsS --compressed --max-time 30 "$SITE_ORIGIN/state/ledger.json" -o .state/ledger.json; then
            echo "recovered $(wc -c < .state/ledger.json) bytes of ledger"
          else
            echo "no previous ledger (first run, or the site is not published yet)"
          fi

      - name: collect, verify and publish
        env:
          # The feed lists live in these secrets and nowhere else. config/run.json carries the run
          # settings and an empty source list, so a run without SHELLSHIFT_SOURCES refuses to start
          # rather than publishing from a default nobody chose. The predecessor held its list in a
          # repository secret *and* committed all 118 entries to a public tree: the secret protected
          # nothing and there were two places to forget.
          #
          # run.json is committed and sourceless. The operator's own config/publish.json is ignored
          # by git, so a private config cannot reach a public tree by being forgotten about.
          #
          # One URL per line: Actions masks a multi-line secret line by line, which is what keeps
          # the feeds out of the log even though the run prints per-feed yield.
          #
          # They are read into intermediate names rather than straight into SHELLSHIFT_* because
          # an absent secret expands to an empty string, and an empty override is a misconfigured
          # secret rather than "use the file" — the binary refuses to start on one. So the real
          # variable is exported only when the secret actually has content.
          SOURCES_SECRET: ${{ secrets.SHELLSHIFT_SOURCES }}
          WHITELIST_DOMAINS_SECRET: ${{ secrets.SHELLSHIFT_WHITELIST_DOMAINS }}
          WHITELIST_NETWORKS_SECRET: ${{ secrets.SHELLSHIFT_WHITELIST_NETWORKS }}
        run: |
          # Failing here rather than letting the binary report "config: no sources" names the
          # cause: the list is not missing from a file, it is missing from the secret.
          if [ -z "$SOURCES_SECRET" ]; then
            echo "::error::SHELLSHIFT_SOURCES is empty or unset, and the feed list is not in the repository. Set the secret; there is nothing to collect from."
            exit 1
          fi
          export SHELLSHIFT_SOURCES="$SOURCES_SECRET"
          echo "sources: from the repository secret"

          # The whitelist decides the class that carries the project's central claim, so its
          # absence is announced rather than left to look like a class nobody qualified for.
          if [ -n "$WHITELIST_DOMAINS_SECRET" ]; then
            export SHELLSHIFT_WHITELIST_DOMAINS="$WHITELIST_DOMAINS_SECRET"
          else
            echo "::warning::SHELLSHIFT_WHITELIST_DOMAINS is unset: no node will be classified as whitelisted by domain"
          fi
          if [ -n "$WHITELIST_NETWORKS_SECRET" ]; then
            export SHELLSHIFT_WHITELIST_NETWORKS="$WHITELIST_NETWORKS_SECRET"
          else
            echo "::warning::SHELLSHIFT_WHITELIST_NETWORKS is unset: no node will be classified as whitelisted by network"
          fi

          ./shellshift run \
            -config config/run.json \
            -out dist \
            -state .state/ledger.json

      - name: render the site
        run: |
          ./shellshift site -data dist/network.json -out dist -origin "$SITE_ORIGIN"
          # The ledger is published so the next run can find it. It is state, not a document, so
          # it lives under its own path rather than beside the subscriptions.
          mkdir -p dist/state
          cp .state/ledger.json dist/state/ledger.json

      - name: what is being published
        run: |
          echo "::group::artifact"
          find dist -type f -printf '%10s  %p\n' | sort -k2
          echo "::endgroup::"
          echo "total: $(du -sh dist | cut -f1)"

      # Node 24. The previous pins were the last Node 20 releases and the runner had started
      # forcing them onto 24 with a deprecation annotation on every run; upload-pages-artifact is
      # bumped for the same reason one level down — its v4 pinned upload-artifact v4.6.2, which is
      # the SHA the annotation named. No input changed across any of the three bumps.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A Pages deployment is not a push, so a repository that publishes only through the artifact
  # never moves in "Recently updated", however often it runs. A push to any branch does. The subs
  # branch is one orphan commit force-pushed over itself on every run: main gains nothing, the
  # branch has no history to grow, and GitHub counts contributors on the default branch only.
  # It is also a second address for the subscriptions, for networks that block github.io.
  #
  # Only the subscriptions are mirrored. network.json is 2 MB that only the dashboard reads, and
  # every superseded copy stays in the repository's object store until GitHub collects it.
  #
  # A job of its own because it is the only one that writes to the repository, and the job that
  # parses hostile input from public feeds should not hold that permission.
  mirror:
    name: mirror subscriptions to the subs branch
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      # This run's own Pages artifact, so the mirror is byte-identical to what was just deployed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: push the subs branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="$RUNNER_TEMP/site"
          mirror="$RUNNER_TEMP/mirror"
          mkdir -p "$site" "$mirror"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$site"
          cp "$site"/sub_*.txt "$mirror"/
          ls -l "$mirror"

          cd "$mirror"
          git init -q -b subs
          git add -A
          # Authored as the maintainer, like every other commit here, so no bot identity appears
          # in the history of any branch.
          git -c user.name=tuftyxxeW -c user.email=343729923+tuftyxxeW@users.noreply.github.com \
            commit -q -m "subscriptions $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/subs

      # A public repository's scheduled workflows are disabled after sixty days without activity,
      # and a scheduled run does not count as activity. Re-enabling an enabled workflow restarts
      # that clock without a commit.
      - name: keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/enable" --silent
